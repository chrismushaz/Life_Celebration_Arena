{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register - {{ event.title }}{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Register for {{ event.title }}</h1>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="form-section" data-aos="fade-up">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-gold w-100 mt-3">Complete Registration</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
