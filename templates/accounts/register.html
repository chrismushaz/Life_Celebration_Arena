{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Register - Grace Community Church{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container"><h1>Create Account</h1></div>
</section>
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="form-section" data-aos="fade-up">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-gold w-100 mt-3">Register</button>
                    </form>
                    <p class="text-center mt-3">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
