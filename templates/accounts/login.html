{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Grace Community Church{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container"><h1>Login</h1></div>
</section>
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="form-section" data-aos="fade-up">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-gold w-100 mt-3">Login</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'accounts:password_reset' %}">Forgot password?</a><br>
                        <a href="{% url 'accounts:register' %}">Create an account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
