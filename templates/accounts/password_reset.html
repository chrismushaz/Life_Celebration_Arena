{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Password Reset - Grace Community Church{% endblock %}

{% block content %}
<section class="page-header"><div class="container"><h1>Reset Password</h1></div></section>
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="form-section">
                    <p>Enter your email address and we'll send you a link to reset your password.</p>
                    <form method="post">{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-gold w-100 mt-3">Send Reset Link</button></form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
